# Déploiement Kamal : https://kamal-deploy.org
# POC : une instance Scaleway (Paris, hors HDS). Variables à fournir (voir .kamal/secrets) :
#   SERVEUR_IP, APP_HOST, et les secrets (RAILS_MASTER_KEY, STRIPE_*, SMTP_*).
service: ludortho
image: ludortho

servers:
  web:
    - <%= ENV.fetch("SERVEUR_IP", "0.0.0.0") %>

ssh:
  user: <%= ENV.fetch("SERVEUR_UTILISATEUR", "root") %>

# HTTPS automatique (Let's Encrypt) par kamal-proxy
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "example.com") %>

# Registre local, transmis par le tunnel SSH : aucun registre externe à créer
registry:
  server: localhost:5555

# L'image se construit depuis la racine du dépôt (jeux Vite + Rails)
builder:
  arch: amd64
  context: ..
  dockerfile: ../Dockerfile

env:
  clear:
    SOLID_QUEUE_IN_PUMA: true
    APP_HOST: "<%= ENV.fetch("APP_HOST", "example.com") %>"
    # Version de test : bandeau « pas de vraies données de patients » (hébergement hors HDS)
    PORTAIL_POC: "<%= ENV.fetch("PORTAIL_POC", "1") %>"
    MAIL_FROM: "<%= ENV.fetch("MAIL_FROM", "contact@example.com") %>"
    SMTP_ADDRESS: "<%= ENV.fetch("SMTP_ADDRESS", "") %>"
    SMTP_USERNAME: "<%= ENV.fetch("SMTP_USERNAME", "") %>"
  secret:
    - RAILS_MASTER_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - SMTP_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  admin: app exec --reuse "bin/rails portail:admin"

volumes:
  - "ludortho_storage:/rails/storage"

asset_path: /rails/public/assets
